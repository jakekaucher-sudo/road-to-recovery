<!doctype html><html><head><meta charset="utf-8"><title>Portrait cut-out</title></head><body style="margin:0;background:#556">
<script>addEventListener("error",e=>window.__error=String(e.message||e));</script>
<script type="module">
// Cuts a character portrait out of its white background (flood fill from the edges, so white
// clothing inside the outline stays) and crops it. Usage: cutout.html?src=../art/sam/src/sam-original.webp&crop=250,380,1000,1020&w=512&seeds=605,577;921,577;974,972
const q = new URLSearchParams(location.search), [cx, cy, cw, ch] = q.get("crop").split(",").map(Number), outW = +(q.get("w") || 512);
const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = q.get("src"); });
const W = img.naturalWidth, H = img.naturalHeight, c = document.createElement("canvas"); c.width = W; c.height = H;
const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(img, 0, 0);
const id = g.getImageData(0, 0, W, H), d = id.data, bg = new Uint8Array(W * H);
const white = (p) => Math.min(d[p * 4], d[p * 4 + 1], d[p * 4 + 2]) > 228;
const st = []; for (let x = 0; x < W; x++) { st.push(x, (H - 1) * W + x); } for (let y = 0; y < H; y++) { st.push(y * W, y * W + W - 1); }
// enclosed background pockets (e.g. inside a headset band): seeds=x,y;x,y — nearest white pixel to each
for (const sd of (q.get("seeds") || "").split(";").filter(Boolean)) { const [sx, sy] = sd.split(",").map(Number); let best = -1, bd = 1e9;
  for (let dy = -24; dy <= 24; dy++) for (let dx = -24; dx <= 24; dx++) { const x = sx + dx, y = sy + dy, p = y * W + x; if (x >= 0 && y >= 0 && x < W && y < H && white(p) && dx * dx + dy * dy < bd) { bd = dx * dx + dy * dy; best = p; } }
  if (best >= 0) st.push(best); }
while (st.length) { const p = st.pop(); if (bg[p] || !white(p)) continue; bg[p] = 1; const x = p % W, y = (p / W) | 0;
  if (x > 0) st.push(p - 1); if (x < W - 1) st.push(p + 1); if (y > 0) st.push(p - W); if (y < H - 1) st.push(p + W); }
for (let p = 0; p < W * H; p++) {
  if (bg[p]) { d[p * 4 + 3] = 0; continue; }
  // soften the rim: light pixels touching the background fade out
  const x = p % W, y = (p / W) | 0; let near = 0; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const xx = x + dx, yy = y + dy; if (xx >= 0 && yy >= 0 && xx < W && yy < H && bg[yy * W + xx]) near++; }
  if (near) { const m = Math.min(d[p * 4], d[p * 4 + 1], d[p * 4 + 2]); d[p * 4 + 3] = Math.round(255 * Math.max(0.35, Math.min(1, (255 - m) / 90))); }
}
g.putImageData(id, 0, 0);
const o = document.createElement("canvas"); o.width = outW; o.height = Math.round(outW * ch / cw); o.getContext("2d").drawImage(c, cx, cy, cw, ch, 0, 0, o.width, o.height);
document.body.appendChild(o); window.__png = o.toDataURL("image/png"); window.__ready = true;
</script></body></html>
