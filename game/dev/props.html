<!doctype html><html><head><meta charset="utf-8"><title>Props test</title>
<style>html,body{margin:0;background:#222;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
</head><body>
<script>addEventListener("error",e=>window.__error=String(e.message||e));addEventListener("unhandledrejection",e=>window.__error=String(e.reason&&e.reason.stack||e.reason));</script>
<script type="module">
// Lays out every variant of one prop kind in a row: props.html?kind=house
import * as THREE from "three";
import { PROPS } from "../src/three/props3d.js";
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1); r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xa9c0d4);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xcfe2f5, 0x5a5040, 1.2)); const sun = new THREE.DirectionalLight(0xfff1d6, 2.2); sun.position.set(-8, 12, 10); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({ color: 0x6f8a48 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
let row = new THREE.Group(); scene.add(row);
window.show = (kind) => { scene.remove(row); row = new THREE.Group(); scene.add(row); const b = PROPS[kind](); const gs = Array.isArray(b) ? b : [b];
  gs.forEach((g, i) => { const m = new THREE.Mesh(g, mat); m.position.x = (i - (gs.length - 1) / 2) * 16; row.add(m); }); return gs.length + " variants, " + gs.map(g => g.attributes.position.count).join("/") + " verts"; };
window.setView = (az, el, dist, tx = 0) => { cam.position.set(tx + Math.sin(az) * dist, el, Math.cos(az) * dist); cam.lookAt(tx, 3, 0); r.render(scene, cam); return "ok"; };
window.__ready = true;
</script></body></html>
