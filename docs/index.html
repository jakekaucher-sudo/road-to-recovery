<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Road to Recovery</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#040C24">
<style>
  html, body { margin: 0; height: 100%; background: #040C24; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Source Sans 3", Helvetica, Arial, sans-serif; color: #DEEAF2; }
  #app { position: fixed; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; overflow: hidden; }   /* turned as a whole by src/orient.js */
  canvas#gl, canvas#ui { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  canvas#gl { visibility: hidden; } body.show3d canvas#gl { visibility: visible; }
  canvas#ui { z-index: 2; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; letter-spacing: 2px; color: #ECC444; background: #040C24; text-align: center; padding: 20px; }
  #status pre { white-space: pre-wrap; color: #ffb4b4; font-size: 14px; text-align: left; }
  /* phone & tablet controls: only during the race */
  .pedal, #pauseBtn, #recal { display: none; position: fixed; z-index: 5; user-select: none; border: 2px solid #ECC444; color: #FEFEFE; background: rgba(14,46,106,0.55);
    font: 800 13px/1 Helvetica, Arial, sans-serif; letter-spacing: 1px; align-items: center; justify-content: center; box-shadow: 0 0 14px rgba(236,196,68,0.35); -webkit-tap-highlight-color: transparent; }
  .pedal { width: 92px; height: 92px; border-radius: 50%; bottom: max(18px, env(safe-area-inset-bottom)); }
  #gas { right: max(22px, env(safe-area-inset-right)); border-color: #5CC8FF; box-shadow: 0 0 14px rgba(92,200,255,0.45); }
  #brake { left: max(22px, env(safe-area-inset-left)); border-color: #CD2127; box-shadow: 0 0 14px rgba(205,33,39,0.45); }
  .pedal.held { background: rgba(236,196,68,0.45); transform: scale(0.94); }
  #pauseBtn, #recal { width: 44px; height: 44px; border-radius: 10px; top: max(10px, env(safe-area-inset-top)); font-size: 18px; }
  #pauseBtn { left: calc(50% + 86px); } #recal { left: calc(50% - 130px); }
  body.mobile.racing .pedal, body.mobile.racing #pauseBtn { display: flex; }
  body.mobile.racing.tiltmode #recal, body.mobile.paused.tiltmode #recal { display: flex; }
  /* steering switch: on the title screen and the pause screen */
  #steerBtn { display: none; position: fixed; z-index: 6; padding: 11px 16px; border: 2px solid #ECC444; border-radius: 10px; background: rgba(14,46,106,0.8); color: #FEFEFE;
    font: 800 13px/1 Helvetica, Arial, sans-serif; letter-spacing: 1px; -webkit-tap-highlight-color: transparent; }
  body.mobile.ontitle #steerBtn { display: block; top: max(12px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); }
  body.mobile.paused #steerBtn { display: block; top: 74%; left: 50%; transform: translateX(-50%); }
  /* helicopter escort button: phones, only once the escort has been earned */
  #heliBtn { display: none; position: fixed; z-index: 5; width: 74px; height: 74px; padding: 0; border-radius: 50%; right: max(31px, env(safe-area-inset-right)); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 108px);
    border: 2px solid #ECC444; background: rgba(14,46,106,0.72); color: #FEFEFE; font: 800 10px/1 Helvetica, Arial, sans-serif; letter-spacing: 1px; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    box-shadow: 0 0 16px rgba(236,196,68,0.55); animation: heliPulse 1.1s ease-in-out infinite; -webkit-tap-highlight-color: transparent; }
  #heliBtn svg { width: 44px; height: 24px; }
  @keyframes heliPulse { 50% { box-shadow: 0 0 28px rgba(236,196,68,0.95); transform: scale(1.06); } }
  body.mobile.racing.escortready #heliBtn { display: flex; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #040C24; color: #ECC444; align-items: center; justify-content: center; text-align: center; font: 800 20px Helvetica, Arial; letter-spacing: 2px; padding: 30px; }
  body.mobile.portrait #rotate { display: flex; flex-direction: column; } body.mobile.portrait.anyway #rotate { display: none; }
  #anyway { margin-top: 26px; padding: 12px 20px; border: 2px solid #ECC444; border-radius: 10px; background: transparent; color: #ECC444; font: 800 14px Helvetica, Arial; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="app">
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<div id="status">Loading…</div>
<div id="brake" class="pedal">BRAKE</div>
<div id="gas" class="pedal">GAS</div>
<button id="pauseBtn" aria-label="Pause">II</button>
<button id="recal" aria-label="Re-center steering">&#9678;</button>
<button id="steerBtn" type="button" aria-label="Switch steering between tilt and drag">STEER: TILT</button>
<button id="heliBtn" type="button" aria-label="Call the helicopter escort"><svg viewBox="0 0 64 34" aria-hidden="true"><path fill="currentColor" d="M3 3h58v3H3zM30 6h4v6h-4zM12 15c0-3 4-4 9-4h13c7 0 12 3 14 8l1 3H21c-5 0-9-3-9-7zM48 17l13-5v4l-12 5zM20 25h3v5h-3zM38 25h3v5h-3zM13 30h33v2.5H13z"/><path fill="#0E2E6A" d="M15 15h6v4h-6z"/></svg>ESCORT</button>
</div>
<div id="rotate">ROTATE YOUR PHONE<br>TO LANDSCAPE<br><br><span id="steerHint" style="font-size:14px;color:#DEEAF2">The game plays sideways</span><button id="anyway" type="button" onclick="document.body.classList.add('anyway')">PLAY IN PORTRAIT</button></div>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
