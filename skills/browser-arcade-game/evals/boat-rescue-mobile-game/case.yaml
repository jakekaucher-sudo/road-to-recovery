schema_version: "1.1"
name: boat-rescue-mobile-game
expected_outcome: |
  A game/ folder with index.html, config.js and src/, using Three.js from vendor/ via an importmap, that plays in a browser: a boat moves through a flooded area, rooftop pickups add to a score against a timer, keyboard controls on desktop, and on phones on-screen controls plus tilt steering requested inside a tap with a drag fallback and a TILT/DRAG switch. Names are labeled fictional, colors are navy and orange, and the run includes a headless screenshot or playtest at a phone size.
